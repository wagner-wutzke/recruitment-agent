server.port=9090
spring.ai.vectorstore.chroma.client.host=${CHROMA_HOST:http://localhost}
spring.ai.vectorstore.chroma.client.port=${CHROMA_PORT:8000}
spring.ai.vectorstore.chroma.collection-name=recruitment-resumes
spring.ai.vectorstore.chroma.initialize-schema=true
spring.ai.embedding.transformer.cache.directory=${user.home}/.cache/recruitment-agent/onnx
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.openai.chat.model=${candidate.matching.model}
candidate.matching.model=${CANDIDATE_MATCHING_MODEL:gpt-6-luna}
candidate.matching.similarity-threshold=${CANDIDATE_MATCHING_SIMILARITY_THRESHOLD:0.5}
candidate.matching.top-k=${CANDIDATE_MATCHING_TOP_K:10}
candidate.matching.system-prompt-file=classpath:prompts/candidate-ranking-system.txt
candidate.matching.user-prompt-file=classpath:prompts/candidate-ranking-user.txt
candidate.matching.map-prompt-file=classpath:prompts/candidate-ranking-map.txt
candidate.matching.final-ranking-prompt-file=classpath:prompts/candidate-ranking-final.txt
candidate.matching.pipeline.retrieval-top-k=120
candidate.matching.pipeline.map-batch-size=3
candidate.matching.pipeline.shortlist-size=3
candidate.matching.pipeline.result-limit=3
candidate.matching.pipeline.max-concurrency=2
candidate.matching.pipeline.max-evidence-chars-per-candidate=24000
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/recruitment_agent_test}
resume.indexing.chunk-size=800
resume.indexing.keep-separator=true
resume.indexing.max-num-chunks=100
resume.indexing.min-chunk-length-to-embed=20
resume.indexing.min-chunk-size-chars=350
