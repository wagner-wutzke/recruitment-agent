server.port=9090
# spring ai vector store
spring.ai.vectorstore.chroma.client.host=${CHROMA_HOST:http://localhost}
spring.ai.vectorstore.chroma.client.port=${CHROMA_PORT:8000}
spring.ai.vectorstore.chroma.collection-name=recruitment-resumes
spring.ai.vectorstore.chroma.initialize-schema=true
spring.ai.embedding.transformer.cache.directory=${user.home}/.cache/recruitment-agent/onnx
# spring ai openai
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${candidate.matching.model}
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none
# spring mongodb
# spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/recruitment_agent}
spring.mongodb.authentication-database=admin
spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.database=recruitment_agent
spring.mongodb.username=admin
spring.mongodb.password=secret_password
#resume indexing
resume.indexing.chunk-size=${RESUME_INDEXING_CHUNK_SIZE:600}
resume.indexing.min-chunk-size-chars=${RESUME_INDEXING_MIN_CHUNK_SIZE_CHARS:250}
resume.indexing.min-chunk-length-to-embed=${RESUME_INDEXING_MIN_CHUNK_LENGTH_TO_EMBED:20}
resume.indexing.max-num-chunks=${RESUME_INDEXING_MAX_NUM_CHUNKS:10000}
resume.indexing.keep-separator=${RESUME_INDEXING_KEEP_SEPARATOR:true}
# candidate matching model
candidate.matching.model=${CANDIDATE_MATCHING_MODEL:gpt-6-luna}
candidate.matching.similarity-threshold=${CANDIDATE_MATCHING_SIMILARITY_THRESHOLD:0.2}
candidate.matching.top-k=${CANDIDATE_MATCHING_TOP_K:4}
candidate.matching.system-prompt-file=${CANDIDATE_MATCHING_SYSTEM_PROMPT_FILE:classpath:prompts/candidate-ranking-system.txt}
candidate.matching.user-prompt-file=${CANDIDATE_MATCHING_USER_PROMPT_FILE:classpath:prompts/candidate-ranking-user.txt}
# logging
logging.level.org.springframework.ai.chat.client.advisor=${OPENAI_CHAT_LOGLEVEL:DEBUG}
