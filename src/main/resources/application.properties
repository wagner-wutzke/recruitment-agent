server.port=9090
# spring ai vector store
spring.ai.vectorstore.chroma.client.host=${CHROMA_HOST:http://localhost}
spring.ai.vectorstore.chroma.client.port=${CHROMA_PORT:8000}
spring.ai.vectorstore.chroma.collection-name=recruitment_resumes
spring.ai.vectorstore.chroma.initialize-schema=true
spring.ai.embedding.transformer.cache.directory=${user.home}/.cache/recruitment-agent/onnx
# spring ai openai
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${candidate.matching.model}
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none
# spring mongodb
spring.mongodb.authentication-database=admin
spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.database=recruitment_agent
spring.mongodb.username=admin
spring.mongodb.password=secret_password
#resume indexing
resume.indexing.chunk-size=${RESUME_INDEXING_CHUNK_SIZE:800}
resume.indexing.min-chunk-size-chars=${RESUME_INDEXING_MIN_CHUNK_SIZE_CHARS:350}
resume.indexing.min-chunk-length-to-embed=${RESUME_INDEXING_MIN_CHUNK_LENGTH_TO_EMBED:20}
resume.indexing.max-num-chunks=${RESUME_INDEXING_MAX_NUM_CHUNKS:100}
resume.indexing.keep-separator=${RESUME_INDEXING_KEEP_SEPARATOR:true}
# candidate matching model
candidate.matching.model=${CANDIDATE_MATCHING_MODEL:gpt-5.6-sol}
candidate.matching.similarity-threshold=${CANDIDATE_MATCHING_SIMILARITY_THRESHOLD:0.5}
candidate.matching.top-k=${CANDIDATE_MATCHING_TOP_K:10}
candidate.matching.system-prompt-file=${CANDIDATE_MATCHING_SYSTEM_PROMPT_FILE:classpath:prompts/candidate-ranking-system.txt}
# The staged pipeline uses retrieval-top-k; candidate.matching.top-k is retained for legacy config.
candidate.matching.pipeline.retrieval-top-k=${CANDIDATE_MATCHING_PIPELINE_RETRIEVAL_TOP_K:1200}
candidate.matching.pipeline.max-candidates=${CANDIDATE_MATCHING_PIPELINE_MAX_CANDIDATES:100}
candidate.matching.pipeline.map-batch-size=${CANDIDATE_MATCHING_PIPELINE_MAP_BATCH_SIZE:3}
candidate.matching.pipeline.shortlist-size=${CANDIDATE_MATCHING_PIPELINE_SHORTLIST_SIZE:3}
candidate.matching.pipeline.result-limit=${CANDIDATE_MATCHING_PIPELINE_RESULT_LIMIT:3}
candidate.matching.pipeline.max-concurrency=${CANDIDATE_MATCHING_PIPELINE_MAX_CONCURRENCY:5}
candidate.matching.pipeline.max-evidence-chars-per-candidate=${CANDIDATE_MATCHING_PIPELINE_MAX_EVIDENCE_CHARS_PER_CANDIDATE:24000}
candidate.matching.map-prompt-file=${CANDIDATE_MATCHING_MAP_PROMPT_FILE:classpath:prompts/candidate-ranking-map.txt}
candidate.matching.final-ranking-prompt-file=${CANDIDATE_MATCHING_FINAL_RANKING_PROMPT_FILE:classpath:prompts/candidate-ranking-final.txt}

# Keep model prompts and completions out of logs because they contain resume evidence and PII.
spring.ai.chat.client.observations.log-prompt=true
spring.ai.chat.client.observations.log-completion=true
logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=DEBUG
logging.level.org.springframework.ai.vectorstore=DEBUG
logging.level.org.springframework.ai.vectorstore.chroma=DEBUG
logging.level.ai.djl.pytorch.engine=WARN
